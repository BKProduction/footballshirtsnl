name: Daily sync and deploy FootballshirtsNL

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: footballshirtsnl-sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Sync FootballshirtsNL
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate sync files
        run: |
          node --check sync.js
          node --check autosave-sync.js
          node --check externalize-images.js

      - name: Sync catalog with checkpoints
        env:
          CHECKPOINT_MINUTES: 5
          SYNC_CONCURRENCY: 2
          SYNC_DELAY_MS: 180
          SYNC_BATCH_SIZE: 25
          MAX_IMAGES_PER_ALBUM: 6
          SYNC_MAX_PAGES: 100
          SYNC_CATEGORY_MAX_PAGES: 100
          SYNC_COLLECTION_MAX_PAGES: 100
