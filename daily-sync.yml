name: Daily sync and deploy FootballshirtsNL
on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Sync catalog and download images
        run: npm run sync
      - name: Save catalog metadata
        run: |
          git config user.name "footballshirtsnl-sync"
          git config user.email "footballshirtsnl-sync@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet || git commit -m "Update FootballshirtsNL catalog"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
