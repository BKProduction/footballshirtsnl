name: Daily sync and deploy FootballshirtsNL

on:
  schedule:
    - cron: "15 3 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: footballshirtsnl-sync-and-deploy
  cancel-in-progress: false

jobs:

  sync:
    name: Sync FootballshirtsNL
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Download website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate sync files
        run: |
          node --check sync.js
          node --check autosave-sync.js

      - name: Sync catalog with checkpoints
        env:
          CHECKPOINT_MINUTES: 5
          SYNC_CONCURRENCY: 2
          SYNC_DELAY_MS: 180
          SYNC_BATCH_SIZE: 25
          MAX_IMAGES_PER_ALBUM: 6
          SYNC_MAX_PAGES: 100
          SYNC_CATEGORY_MAX_PAGES: 100
          SYNC_COLLECTION_MAX_PAGES: 100

        run: node autosave-sync.js

      - name: Save final updated catalog
        run: |
          git config user.name "footballshirtsnl-sync"
          git config user.email "footballshirtsnl-sync@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Geen nieuwe wijzigingen om definitief op te slaan."
          else
            git commit -m "Update FootballshirtsNL catalog"
            git push origin HEAD:main
          fi

      - name: Create GitHub Pages website
        run: |
          rm -rf public
          mkdir -p public

          cp index.html public/
          cp app.js public/
          cp style.css public/

          cp -R data public/data
          cp -R assets public/assets

          echo "Inhoud GitHub Pages:"
          du -sh public
          du -sh public/*

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload FootballshirtsNL
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy FootballshirtsNL
    runs-on: ubuntu-latest

    needs:
      - sync

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy FootballshirtsNL
        id: deployment
        uses: actions/deploy-pages@v4
