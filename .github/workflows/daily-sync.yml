name: Daily sync and deploy FootballshirtsNL

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  NODE_VERSION: "22"

concurrency:
  group: footballshirtsnl-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync FootballshirtsNL
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sync files
        run: |
          node --check sync.js
          node --check autosave-sync.js

      - name: Sync catalog with checkpoints
        run: node autosave-sync.js

      - name: Save sync result
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/catalog.json data/sync-state.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om op te slaan."
            exit 0
          fi

          git commit -m "Update catalog and sync checkpoint"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true

            if git push origin HEAD:main; then
              echo "Catalogus/checkpoint opgeslagen."
              exit 0
            fi

            echo "Push poging ${attempt} mislukt; nieuwe poging over 15 seconden."
            sleep 15
          done

          echo "Kon catalogus/checkpoint niet opslaan."
          exit 1

      - name: Refresh checkout after final push
        if: success()
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Create GitHub Pages website
        if: success()
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site/data

          cp index.html _site/
          cp app.js _site/
          cp style.css _site/
          cp data/catalog.json _site/data/catalog.json

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload FootballshirtsNL
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy FootballshirtsNL
    needs: sync
    if: needs.sync.result == 'success'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
